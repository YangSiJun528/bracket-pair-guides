name: Visual Contracts
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    name: Driver / exact reviewed pixels
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      VISUAL_TEST_ENVIRONMENT: ideaIC-2024.2.6/linux-x64-xvfb96-darcula-scale1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run exact comparison; never record baselines
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./gradlew :plugin:visualTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-contract-evidence
          path: |
            plugin/build/visual-test-artifacts/
            plugin/build/reports/tests/visualTest/
            plugin/build/test-results/visualTest/
          if-no-files-found: error
          retention-days: 14
