# Run the deterministic IntelliJ Driver visual regression test on demand.

name: Visual Test
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character lowercase commit SHA to test
        required: true
        type: string
  pull_request:
    branches: [ main ]
    types: [ labeled, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: >-
    visual-test-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.run_id }}-${{
    (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
    github.event.label.name != 'visual-test') && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  visualTest:
    name: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'visual-test') &&
      (github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size) &&
      (github.event.action != 'labeled' || github.event.label.name == 'visual-test'))) &&
      'Visual Test' || 'Visual Test (not requested)' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'visual-test') &&
      (github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size) &&
      (github.event.action != 'labeled' || github.event.label.name == 'visual-test'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      VISUAL_TEST_COMMIT_SHA: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha ||
        github.event.pull_request.head.sha }}
      VISUAL_TEST_ENVIRONMENT: ideaIC-2024.2.6/linux-x64-xvfb96-darcula-scale1

    steps:
      - name: Validate Commit SHA
        shell: bash
        run: |
          if [[ ! "$VISUAL_TEST_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase hexadecimal SHA" >&2
            exit 1
          fi

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VISUAL_TEST_COMMIT_SHA }}
          persist-credentials: false

      - name: Verify Exact Checkout
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$VISUAL_TEST_COMMIT_SHA" ]]; then
            echo "Expected $VISUAL_TEST_COMMIT_SHA, checked out $checked_out_sha" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Run Visual Tests
        id: visual-test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p plugin/build
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -dpi 96 -nolisten tcp -ac" \
            ./gradlew --no-daemon visualTest --stacktrace \
            2>&1 | tee plugin/build/visual-test-gradle.log

      - name: Upload Option OFF Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: show-active-guide-off-actual.png
          path: plugin/build/visual-test-artifacts/show-active-guide-off-actual.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Option ON Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: show-active-guide-on-actual.png
          path: plugin/build/visual-test-artifacts/show-active-guide-on-actual.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload IntelliJ Integration Settings Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intellij-integration-settings.png
          path: plugin/build/visual-test-artifacts/intellij-integration-settings.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload IntelliJ Highlight Settings Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intellij-highlight-on-caret-movement-settings.png
          path: plugin/build/visual-test-artifacts/intellij-highlight-on-caret-movement-settings.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Native Highlight Modes Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-highlight-modes-popup.png
          path: plugin/build/visual-test-artifacts/native-highlight-modes-popup.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Native Guide Overlap Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-overlap-actual.png
          path: plugin/build/visual-test-artifacts/native-guide-overlap-actual.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Default Native Guide Suppression Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-default-suppressed-actual.png
          path: plugin/build/visual-test-artifacts/native-guide-default-suppressed-actual.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Plugin Guide Only Capture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-guide-only-actual.png
          path: plugin/build/visual-test-artifacts/plugin-guide-only-actual.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Native Guide Overlap Detail
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-overlap-detail.png
          path: plugin/build/visual-test-artifacts/native-guide-overlap-detail.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Default Native Guide Suppression Detail
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-default-suppressed-detail.png
          path: plugin/build/visual-test-artifacts/native-guide-default-suppressed-detail.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Plugin Guide Only Detail
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-guide-only-detail.png
          path: plugin/build/visual-test-artifacts/plugin-guide-only-detail.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Native Guide Conflict Notification
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-conflict-notification.png
          path: plugin/build/visual-test-artifacts/native-guide-conflict-notification.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Expanded Native Guide Conflict Notification
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-conflict-balloon.png
          path: plugin/build/visual-test-artifacts/native-guide-conflict-balloon.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Native Guide Conflict Review Settings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-guide-conflict-review-settings.png
          path: plugin/build/visual-test-artifacts/native-guide-conflict-review-settings.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Legacy Diff Image
        if: ${{ always() && steps.visual-test.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diff.png
          path: plugin/build/visual-test-artifacts/diff.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Full Diff Image
        if: ${{ always() && steps.visual-test.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diff-v2.png
          path: plugin/build/visual-test-artifacts/diff-v2.png
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Legacy Metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-metrics.json
          path: plugin/build/visual-test-artifacts/visual-test-metrics.json
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Metrics V2
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-metrics-v2.json
          path: plugin/build/visual-test-artifacts/visual-test-metrics-v2.json
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-test-diagnostics
          path: |
            plugin/build/reports/tests/visualTest
            plugin/build/test-results/visualTest
            plugin/build/visual-test-artifacts
            plugin/build/visual-test-gradle.log
            out/perf-startup/tests/*/*/log
            out/perf-startup/tests/*/*/reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Propagate Visual Test Result
        if: ${{ always() && steps.visual-test.outcome == 'failure' }}
        shell: bash
        run: exit 1
