# Report untrusted visual-test artifacts from a separately privileged workflow.

name: Visual Test Report
on:
  workflow_run:
    workflows: [ Visual Test Scenarios ]
    types: [ completed ]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  report:
    name: Report Visual Test
    # A non-requested visual test has no artifacts to inspect or report.
    if: >-
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'Visual Test Scenarios' &&
      github.event.workflow_run.path == '.github/workflows/visual-test.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      github.event.workflow_run.pull_requests[1] == null
    concurrency:
      group: visual-test-report-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Inspect Allowlisted Artifacts
        id: inspect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const scenarios = [
              'horizontal-only',
              'vertical-only',
              'pair-border-only',
              'pair-background-only',
              'all-components',
              'bracket-colorization-off',
              'plugin-disabled',
              'native-visuals-unmanaged',
              'native-highlight-suppressed',
              'native-indent-hidden',
              'default-palette',
              'custom-palette',
            ]
            const imageNames = scenarios.flatMap(name => [
              `${name}-actual.png`,
              `${name}-baseline.png`,
            ])
            const allowedNames = new Set([
              ...imageNames,
              'visual-test-diagnostics',
            ])
            const maximumSizes = new Map([
              ...imageNames.map(name => [name, 256 * 1024]),
              ['visual-test-diagnostics', 64 * 1024 * 1024],
            ])
            const positiveInteger = value =>
              Number.isSafeInteger(value) && value > 0
            const skip = message => {
              core.info(message)
              core.setOutput('should_report', 'false')
              core.setOutput('image_ids', '')
            }

            const run = context.payload.workflow_run
            const runId = Number(run.id)
            const runAttempt = Number(run.run_attempt)
            const linkedPullRequest = run.pull_requests?.[0]
            const pullNumber = Number(linkedPullRequest?.number)
            if (
              !positiveInteger(runId) ||
              !positiveInteger(runAttempt) ||
              !positiveInteger(pullNumber) ||
              !Array.isArray(run.pull_requests) ||
              run.pull_requests.length !== 1 ||
              run.event !== 'pull_request' ||
              run.name !== 'Visual Test Scenarios' ||
              run.path !== '.github/workflows/visual-test.yml' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              throw new Error('Invalid trusted workflow metadata')
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            })
            const stack = pull.data.stack
            const stackIsValid = stack == null || (
              stack !== null &&
              typeof stack === 'object' &&
              positiveInteger(stack.position) &&
              positiveInteger(stack.size) &&
              stack.position === stack.size &&
              stack.base?.ref === 'main'
            )
            const targetsMain = stack == null
              ? pull.data.base?.ref === 'main'
              : stackIsValid
            const labels = Array.isArray(pull.data.labels)
              ? pull.data.labels.map(label => label.name)
              : []
            const linkedHeadSha = linkedPullRequest?.head?.sha
            if (
              pull.data.state !== 'open' ||
              pull.data.draft !== false ||
              pull.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              !labels.includes('visual-test') ||
              !targetsMain ||
              !stackIsValid ||
              !/^[0-9a-f]{40}$/u.test(linkedHeadSha || '') ||
              run.head_sha !== linkedHeadSha ||
              pull.data.head.sha !== linkedHeadSha
            ) {
              skip('Skipping a pull request that is no longer eligible')
              return
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                attempt_number: runAttempt,
                per_page: 100,
              },
            )
            const requestedVisualJobs = jobs.filter(job => job.name === 'Visual Test')
            const notRequestedVisualJobs = jobs.filter(
              job => job.name === 'Visual Test (not requested)',
            )
            if (requestedVisualJobs.length + notRequestedVisualJobs.length > 1) {
              throw new Error('Expected exactly one visual-test job')
            }
            if (notRequestedVisualJobs.length === 1) {
              if (notRequestedVisualJobs[0].conclusion !== 'skipped') {
                throw new Error('A not-requested visual-test job was not skipped')
              }
              skip('The visual-test job was not requested')
              return
            }
            const visualJob = requestedVisualJobs[0]
            if (visualJob?.conclusion === 'skipped') {
              skip('The visual-test job was not requested')
              return
            }
            if (visualJob === undefined && run.conclusion === 'success') {
              throw new Error('A successful run has no visual-test job')
            }
            const jobStartedAt = Date.parse(visualJob?.started_at || '')
            const jobCompletedAt = Date.parse(visualJob?.completed_at || '')
            const hasAttemptWindow =
              Number.isFinite(jobStartedAt) &&
              Number.isFinite(jobCompletedAt) &&
              jobStartedAt <= jobCompletedAt
            if (visualJob !== undefined && !hasAttemptWindow) {
              if (run.conclusion === 'success') {
                throw new Error('A successful visual-test job has no valid time window')
              }
              core.warning('The failed visual-test job has no artifact time window')
            }

            // The workflow-run artifact endpoint returns artifacts from every rerun
            // attempt. Restrict names to artifacts created while this attempt's one
            // visual-test job was running before checking for duplicates.
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            )
            const selected = artifacts.filter(artifact => {
              if (!hasAttemptWindow) return false
              const createdAt = Date.parse(artifact.created_at || '')
              return Number.isFinite(createdAt) &&
                createdAt >= jobStartedAt &&
                createdAt <= jobCompletedAt &&
                allowedNames.has(artifact.name) &&
                !artifact.expired
            })
            const counts = new Map()
            for (const artifact of selected) {
              counts.set(artifact.name, (counts.get(artifact.name) || 0) + 1)
            }
            if ([...counts.values()].some(count => count !== 1)) {
              throw new Error('Duplicate allowlisted artifact name in this run attempt')
            }
            for (const artifact of selected) {
              if (
                !positiveInteger(artifact.id) ||
                !positiveInteger(artifact.size_in_bytes) ||
                artifact.size_in_bytes > maximumSizes.get(artifact.name)
              ) {
                throw new Error(`Artifact metadata failed validation: ${artifact.name}`)
              }
            }

            const imageIds = imageNames
              .map(name => selected.find(artifact => artifact.name === name)?.id)
              .filter(id => id !== undefined)
            core.setOutput('image_ids', imageIds.join(','))
            core.setOutput('should_report', 'true')

      - name: Download Captures Without Extraction
        id: download-images
        if: ${{ steps.inspect.outputs.image_ids != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.inspect.outputs.image_ids }}
          path: ${{ runner.temp }}/visual-test-images
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Validate Captures and Update Pull Request
        if: ${{ always() && steps.inspect.outputs.should_report == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          IMAGES_DOWNLOAD_OUTCOME: ${{ steps.download-images.outcome }}
          IMAGE_ARTIFACT_IDS: ${{ steps.inspect.outputs.image_ids }}
          IMAGES_DIRECTORY: ${{ runner.temp }}/visual-test-images
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const zlib = require('zlib')

            const marker = '<!-- visual-test-report:v2 -->'
            const legacyMarker = '<!-- visual-test-report:v1 -->'
            const orderPrefix = '<!-- visual-test-report-order-v2:'
            const groups = [
              {
                label: 'Rendering components',
                scenarios: [
                  ['horizontal-only', 'Horizontal guide only'],
                  ['vertical-only', 'Vertical guide only'],
                  ['pair-border-only', 'Pair border only'],
                  ['pair-background-only', 'Pair background only'],
                  ['all-components', 'All components'],
                  ['bracket-colorization-off', 'Bracket colorization off'],
                ],
              },
              {
                label: 'Settings application and native visuals',
                scenarios: [
                  ['plugin-disabled', 'Plugin disabled'],
                  ['native-visuals-unmanaged', 'Native visuals unmanaged'],
                  ['native-highlight-suppressed', 'Native highlight suppressed'],
                  ['native-indent-hidden', 'Native indent guides hidden'],
                ],
              },
              {
                label: 'Colors',
                scenarios: [
                  ['default-palette', 'Default palette'],
                  ['custom-palette', 'Custom palette'],
                ],
              },
            ]
            const scenarios = groups.flatMap(group =>
              group.scenarios.map(([name, label]) => ({name, label})),
            )
            const imageNames = scenarios.flatMap(scenario => [
              `${scenario.name}-actual.png`,
              `${scenario.name}-baseline.png`,
            ])
            const allowedNames = [
              ...imageNames,
              'visual-test-diagnostics',
            ]
            const maximumSizes = new Map([
              ...imageNames.map(name => [name, 256 * 1024]),
              ['visual-test-diagnostics', 64 * 1024 * 1024],
            ])
            const positiveInteger = value =>
              Number.isSafeInteger(value) && value > 0

            const run = context.payload.workflow_run
            const runId = Number(run.id)
            const runNumber = Number(run.run_number)
            const runAttempt = Number(run.run_attempt)
            const linkedPullRequest = run.pull_requests?.[0]
            const pullNumber = Number(linkedPullRequest?.number)
            if (
              !positiveInteger(runId) ||
              !positiveInteger(runNumber) ||
              !positiveInteger(runAttempt) ||
              !positiveInteger(pullNumber) ||
              !Array.isArray(run.pull_requests) ||
              run.pull_requests.length !== 1 ||
              run.event !== 'pull_request' ||
              run.name !== 'Visual Test Scenarios' ||
              run.path !== '.github/workflows/visual-test.yml' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              throw new Error('Invalid trusted workflow metadata')
            }

            const linkedHeadSha = linkedPullRequest?.head?.sha
            const readEligiblePull = async () => {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              })
              const pull = response.data
              if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Refusing to report to a cross-repository pull request')
              }
              const labels = Array.isArray(pull.labels)
                ? pull.labels.map(label => label.name)
                : []
              const stack = pull.stack
              const stackIsValid = stack == null || (
                stack !== null &&
                typeof stack === 'object' &&
                positiveInteger(stack.position) &&
                positiveInteger(stack.size) &&
                stack.position === stack.size &&
                stack.base?.ref === 'main'
              )
              const targetsMain = stack == null
                ? pull.base?.ref === 'main'
                : stackIsValid
              if (
                pull.state !== 'open' ||
                pull.draft !== false ||
                !labels.includes('visual-test') ||
                !targetsMain ||
                !stackIsValid ||
                !/^[0-9a-f]{40}$/u.test(linkedHeadSha || '') ||
                run.head_sha !== linkedHeadSha ||
                pull.head.sha !== linkedHeadSha
              ) {
                return null
              }
              return pull
            }

            if (await readEligiblePull() === null) {
              core.info('Skipping a pull request that is no longer eligible')
              return
            }

            const commentsForPull = async () => github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              },
            )
            const newestExistingReport = comments => comments
              .filter(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                (
                  comment.body?.includes(marker) ||
                  comment.body?.includes(legacyMarker)
                ),
              )
              .sort((left, right) => right.id - left.id)[0]
            const isNewerReport = comment => {
              if (!comment?.body?.includes(marker)) return false
              const orderMatch = comment?.body?.match(
                /<!-- visual-test-report-order-v2:(\d+):(\d+) -->/u,
              )
              if (!orderMatch) return false
              const existingRunId = Number(orderMatch[1])
              const existingAttempt = Number(orderMatch[2])
              return existingRunId > runId ||
                (existingRunId === runId && existingAttempt > runAttempt)
            }
            if (isNewerReport(newestExistingReport(await commentsForPull()))) {
              core.info('A newer visual-test report already exists')
              return
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                attempt_number: runAttempt,
                per_page: 100,
              },
            )
            const requestedVisualJobs = jobs.filter(job => job.name === 'Visual Test')
            const notRequestedVisualJobs = jobs.filter(
              job => job.name === 'Visual Test (not requested)',
            )
            if (requestedVisualJobs.length + notRequestedVisualJobs.length > 1) {
              throw new Error('Visual-test job metadata changed during reporting')
            }
            if (notRequestedVisualJobs.length === 1) {
              if (notRequestedVisualJobs[0].conclusion !== 'skipped') {
                throw new Error('A not-requested visual-test job was not skipped')
              }
              core.info('The visual-test job was not requested')
              return
            }
            const visualJob = requestedVisualJobs[0]
            if (visualJob?.conclusion === 'skipped') {
              core.info('The visual-test job was not requested')
              return
            }
            if (visualJob === undefined && run.conclusion === 'success') {
              throw new Error('A successful run has no visual-test job')
            }
            const jobStartedAt = Date.parse(visualJob?.started_at || '')
            const jobCompletedAt = Date.parse(visualJob?.completed_at || '')
            const hasAttemptWindow =
              Number.isFinite(jobStartedAt) &&
              Number.isFinite(jobCompletedAt) &&
              jobStartedAt <= jobCompletedAt
            if (visualJob !== undefined && !hasAttemptWindow && run.conclusion === 'success') {
              throw new Error('A successful visual-test job has no valid time window')
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            )
            const attemptArtifacts = artifacts.filter(artifact => {
              if (!hasAttemptWindow) return false
              const createdAt = Date.parse(artifact.created_at || '')
              return Number.isFinite(createdAt) &&
                createdAt >= jobStartedAt &&
                createdAt <= jobCompletedAt
            })
            const artifactMap = new Map()
            for (const name of allowedNames) {
              const matches = attemptArtifacts.filter(
                artifact => artifact.name === name && !artifact.expired,
              )
              if (matches.length > 1) {
                throw new Error('Duplicate allowlisted artifact name in this run attempt')
              }
              if (matches.length === 1) {
                const artifact = matches[0]
                if (
                  !positiveInteger(artifact.id) ||
                  !positiveInteger(artifact.size_in_bytes) ||
                  artifact.size_in_bytes > maximumSizes.get(name)
                ) {
                  throw new Error(`Artifact metadata failed validation: ${name}`)
                }
                artifactMap.set(name, {
                  id: artifact.id,
                  size: artifact.size_in_bytes,
                })
              }
            }

            const crcTable = new Uint32Array(256)
            for (let index = 0; index < crcTable.length; index += 1) {
              let value = index
              for (let bit = 0; bit < 8; bit += 1) {
                value = (value & 1) !== 0
                  ? (0xedb88320 ^ (value >>> 1))
                  : (value >>> 1)
              }
              crcTable[index] = value >>> 0
            }
            const pngCrc32 = value => {
              let crc = 0xffffffff
              for (const byte of value) {
                crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8)
              }
              return (crc ^ 0xffffffff) >>> 0
            }
            const pngChunk = (type, data) => {
              const typeBytes = Buffer.from(type, 'ascii')
              const chunk = Buffer.alloc(12 + data.length)
              chunk.writeUInt32BE(data.length, 0)
              typeBytes.copy(chunk, 4)
              data.copy(chunk, 8)
              chunk.writeUInt32BE(
                pngCrc32(Buffer.concat([typeBytes, data])),
                8 + data.length,
              )
              return chunk
            }
            const validatePng = (filePath, artifact, expectedName) => {
              const width = 220
              const height = 240
              const channels = 4
              if (
                path.basename(filePath) !== expectedName ||
                !imageNames.includes(expectedName)
              ) {
                throw new Error('Invalid capture association')
              }
              const stat = fs.lstatSync(filePath)
              if (
                stat.isSymbolicLink() ||
                !stat.isFile() ||
                stat.size !== artifact.size ||
                stat.size <= 0 ||
                stat.size > 256 * 1024
              ) {
                throw new Error('Unsafe capture file')
              }
              const png = fs.readFileSync(filePath)
              const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])
              if (png.length < 45 || !png.subarray(0, 8).equals(signature)) {
                throw new Error('Invalid PNG signature')
              }

              let offset = 8
              let chunkIndex = 0
              let sawHeader = false
              let sawData = false
              let sawEnd = false
              const compressedParts = []
              while (offset < png.length) {
                if (offset + 12 > png.length) {
                  throw new Error('Truncated PNG chunk')
                }
                const length = png.readUInt32BE(offset)
                const typeBytes = png.subarray(offset + 4, offset + 8)
                const type = typeBytes.toString('ascii')
                const dataStart = offset + 8
                const dataEnd = dataStart + length
                const chunkEnd = dataEnd + 4
                if (!/^[A-Za-z]{4}$/u.test(type) || chunkEnd > png.length) {
                  throw new Error('Invalid PNG chunk boundary')
                }
                const data = png.subarray(dataStart, dataEnd)
                if (
                  png.readUInt32BE(dataEnd) !==
                  pngCrc32(Buffer.concat([typeBytes, data]))
                ) {
                  throw new Error('Invalid PNG chunk checksum')
                }

                if (type === 'IHDR') {
                  if (chunkIndex !== 0 || sawHeader || length !== 13) {
                    throw new Error('Invalid PNG header placement')
                  }
                  if (
                    data.readUInt32BE(0) !== width ||
                    data.readUInt32BE(4) !== height ||
                    data[8] !== 8 ||
                    data[9] !== 6 ||
                    data[10] !== 0 ||
                    data[11] !== 0 ||
                    data[12] !== 0
                  ) {
                    throw new Error('Unexpected PNG image format')
                  }
                  sawHeader = true
                } else if (type === 'IDAT') {
                  if (!sawHeader || sawEnd) {
                    throw new Error('Invalid PNG image-data placement')
                  }
                  compressedParts.push(data)
                  sawData = true
                } else if (type === 'IEND') {
                  if (!sawHeader || !sawData || sawEnd || length !== 0) {
                    throw new Error('Invalid PNG end marker')
                  }
                  sawEnd = true
                  if (chunkEnd !== png.length) {
                    throw new Error('Trailing PNG content')
                  }
                } else {
                  throw new Error(`Unexpected PNG chunk: ${type}`)
                }
                offset = chunkEnd
                chunkIndex += 1
              }
              if (!sawHeader || !sawData || !sawEnd) {
                throw new Error('Incomplete PNG')
              }

              const rowSize = 1 + width * channels
              const rawSize = rowSize * height
              const inflated = zlib.inflateSync(Buffer.concat(compressedParts), {
                maxOutputLength: rawSize,
              })
              if (inflated.length !== rawSize) {
                throw new Error('Unexpected PNG pixel-data size')
              }
              for (let row = 0; row < height; row += 1) {
                if (inflated[row * rowSize] > 4) {
                  throw new Error('Invalid PNG row filter')
                }
              }
              const header = Buffer.alloc(13)
              header.writeUInt32BE(width, 0)
              header.writeUInt32BE(height, 4)
              header[8] = 8
              header[9] = 6
              return Buffer.concat([
                signature,
                pngChunk('IHDR', header),
                pngChunk('IDAT', zlib.deflateSync(inflated, {level: 9})),
                pngChunk('IEND', Buffer.alloc(0)),
              ])
            }

            const rawExpectedImageIds = process.env.IMAGE_ARTIFACT_IDS || ''
            const expectedImageIds = rawExpectedImageIds === ''
              ? []
              : rawExpectedImageIds.split(',').map(value => Number(value))
            const currentImageNames = imageNames.filter(name => artifactMap.has(name))
            const currentImageIds = currentImageNames.map(name => artifactMap.get(name).id)
            const validatedFiles = new Map()
            let reporterFailed = false
            if (expectedImageIds.length > 0 || currentImageIds.length > 0) {
              try {
                if (
                  expectedImageIds.some(id => !positiveInteger(id)) ||
                  expectedImageIds.length !== currentImageIds.length ||
                  !expectedImageIds.every((id, index) => id === currentImageIds[index]) ||
                  process.env.IMAGES_DOWNLOAD_OUTCOME !== 'success'
                ) {
                  throw new Error('Capture artifact IDs or download outcome changed')
                }
                const directory = path.resolve(process.env.IMAGES_DIRECTORY)
                const entries = fs.readdirSync(directory).sort()
                const expectedEntries = [...currentImageNames].sort()
                if (
                  entries.length !== expectedEntries.length ||
                  !entries.every((entry, index) => entry === expectedEntries[index])
                ) {
                  throw new Error('Unexpected capture download contents')
                }
                for (const name of currentImageNames) {
                  try {
                    validatedFiles.set(
                      name,
                      validatePng(
                        path.join(directory, name),
                        artifactMap.get(name),
                        name,
                      ),
                    )
                  } catch (_error) {
                    reporterFailed = true
                    core.warning(`Capture failed strict PNG validation: ${name}`)
                  }
                }
              } catch (_error) {
                reporterFailed = true
                core.warning('Capture artifacts failed strict validation')
              }
            }

            for (const scenario of scenarios) {
              const actualName = `${scenario.name}-actual.png`
              const baselineName = `${scenario.name}-baseline.png`
              if (artifactMap.has(baselineName) && !artifactMap.has(actualName)) {
                reporterFailed = true
                core.warning(`Baseline has no current capture: ${scenario.name}`)
              }
            }
            const completeActualSet = scenarios.every(scenario =>
              validatedFiles.has(`${scenario.name}-actual.png`),
            )
            const hasAnyBaseline = scenarios.some(scenario =>
              artifactMap.has(`${scenario.name}-baseline.png`),
            )
            const successContractValid =
              run.conclusion === 'success' && completeActualSet && !hasAnyBaseline
            if (run.conclusion === 'success' && !successContractValid) {
              reporterFailed = true
              core.warning('A successful visual test must provide all current captures and no baselines')
            }

            const displayFileNames = []
            if (successContractValid) {
              for (const scenario of scenarios) {
                displayFileNames.push(`${scenario.name}-actual.png`)
              }
            } else if (run.conclusion === 'failure' && completeActualSet) {
              for (const scenario of scenarios) {
                displayFileNames.push(`${scenario.name}-actual.png`)
                const baselineName = `${scenario.name}-baseline.png`
                if (validatedFiles.has(baselineName)) {
                  displayFileNames.push(baselineName)
                }
              }
            } else if (run.conclusion !== 'success') {
              for (const scenario of scenarios) {
                const actualName = `${scenario.name}-actual.png`
                const baselineName = `${scenario.name}-baseline.png`
                if (
                  validatedFiles.has(actualName) &&
                  validatedFiles.has(baselineName)
                ) {
                  displayFileNames.push(baselineName, actualName)
                }
              }
            }

            const repositoryUrl =
              `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`
            const publishedImages = new Map()
            const filesToPublish = displayFileNames.map(name => [
              name,
              validatedFiles.get(name),
            ])
            if (filesToPublish.length > 0) {
              try {
                if (await readEligiblePull() === null) {
                  core.info('Pull request changed before image publication')
                  return
                }
                const resultPaths = new Map()
                for (const scenario of scenarios) {
                  resultPaths.set(
                    `${scenario.name}-actual.png`,
                    `pull/${pullNumber}/${linkedHeadSha}/scenarios/${scenario.name}/current.png`,
                  )
                  resultPaths.set(
                    `${scenario.name}-baseline.png`,
                    `pull/${pullNumber}/${linkedHeadSha}/scenarios/${scenario.name}/baseline.png`,
                  )
                }
                if (
                  filesToPublish.some(([name, contents]) =>
                    !resultPaths.has(name) || !Buffer.isBuffer(contents),
                  )
                ) {
                  throw new Error('Capture is not safe to publish')
                }

                const branch = 'visual-test-results'
                let parentCommitSha = null
                try {
                  const currentRef = await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch}`,
                  })
                  parentCommitSha = currentRef.data.object.sha
                  if (
                    currentRef.data.object.type !== 'commit' ||
                    !/^[0-9a-f]{40}$/u.test(parentCommitSha || '')
                  ) {
                    throw new Error('Invalid result branch head')
                  }
                } catch (error) {
                  if (error.status !== 404) throw error
                }

                const tree = []
                for (const [name, contents] of filesToPublish) {
                  const blob = await github.rest.git.createBlob({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    content: contents.toString('base64'),
                    encoding: 'base64',
                  })
                  tree.push({
                    path: resultPaths.get(name),
                    mode: '100644',
                    type: 'blob',
                    sha: blob.data.sha,
                  })
                }
                const resultTree = await github.rest.git.createTree({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tree,
                })
                const resultCommit = await github.rest.git.createCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  message:
                    `Publish visual test captures for PR #${pullNumber} at ` +
                    linkedHeadSha.slice(0, 12),
                  tree: resultTree.data.sha,
                  parents: parentCommitSha === null ? [] : [parentCommitSha],
                })
                const resultCommitSha = resultCommit.data.sha
                if (!/^[0-9a-f]{40}$/u.test(resultCommitSha || '')) {
                  throw new Error('Invalid result commit SHA')
                }

                // Revalidate immediately before advancing the public result ref. Blobs
                // and an unreachable commit may have been created, but stale PR output
                // is never published through the result branch.
                if (await readEligiblePull() === null) {
                  core.info('Pull request changed before result ref publication')
                  return
                }
                if (parentCommitSha === null) {
                  await github.rest.git.createRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `refs/heads/${branch}`,
                    sha: resultCommitSha,
                  })
                } else {
                  await github.rest.git.updateRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch}`,
                    sha: resultCommitSha,
                    force: false,
                  })
                }
                for (const [name] of filesToPublish) {
                  publishedImages.set(
                    name,
                    `${repositoryUrl}/blob/${resultCommitSha}/` +
                      `${resultPaths.get(name)}?raw=true`,
                  )
                }
              } catch (_error) {
                reporterFailed = true
                core.warning('Validated captures could not be published')
              }
            }

            if (await readEligiblePull() === null) {
              core.info('Pull request changed before report publication')
              return
            }
            const comments = await commentsForPull()
            const existing = newestExistingReport(comments)
            if (isNewerReport(existing)) {
              core.info('A newer visual-test report already exists')
              return
            }

            const conclusionLabels = new Map([
              ['success', '✅ Passed'],
              ['failure', '❌ Failed'],
              ['cancelled', '⏹️ Cancelled'],
              ['timed_out', '⏱️ Timed out'],
              ['action_required', '⚠️ Action required'],
              ['neutral', '⚠️ Neutral'],
              ['skipped', '⏭️ Skipped'],
              ['stale', '⚠️ Stale'],
              ['startup_failure', '❌ Startup failure'],
            ])
            const status = conclusionLabels.get(run.conclusion) || '⚠️ Completed'
            const runUrl = `${repositoryUrl}/actions/runs/${runId}`
            const commitLine =
              `Tested commit: [\`${linkedHeadSha.slice(0, 12)}\`]` +
              `(${repositoryUrl}/commit/${linkedHeadSha})`
            const createdAt = new Date(run.created_at)
            const expiry = Number.isNaN(createdAt.getTime())
              ? '14 days after the run'
              : new Date(createdAt.getTime() + 14 * 24 * 60 * 60 * 1000)
                .toISOString()
                .slice(0, 10)
            const declaredMismatches = scenarios.filter(scenario =>
              artifactMap.has(`${scenario.name}-baseline.png`),
            )

            const details = [
              'Baselines are committed review artifacts; CI never records, overwrites, or accepts them.',
            ]
            if (successContractValid) {
              details.push('All 12 scenarios matched their committed baselines.')
            } else if (run.conclusion === 'success') {
              details.push('The successful run did not satisfy the strict capture contract.')
            } else if (!completeActualSet) {
              details.push(
                'The run ended before producing a complete scenario set; only validated ' +
                'baseline/current mismatch pairs are shown.',
              )
            } else if (declaredMismatches.length > 0) {
              details.push(
                `${declaredMismatches.length} scenario` +
                `${declaredMismatches.length === 1 ? '' : 's'} did not match the baseline.`,
              )
            } else if (run.conclusion === 'failure') {
              details.push(
                'All scenario captures completed without a declared baseline mismatch; ' +
                'see diagnostics for the remaining contract failure.',
              )
            } else {
              details.push('No baseline mismatch pair was produced; see diagnostics for the run result.')
            }
            if (reporterFailed) {
              details.push('One or more report artifacts were missing, inconsistent, or rejected.')
            }

            const gallery = []
            const showPassingCurrents = successContractValid || (
              run.conclusion === 'failure' &&
              completeActualSet
            )
            for (const group of groups) {
              const groupLines = []
              for (const [name, label] of group.scenarios) {
                const actualName = `${name}-actual.png`
                const baselineName = `${name}-baseline.png`
                const actualUrl = publishedImages.get(actualName)
                const baselineUrl = publishedImages.get(baselineName)
                const mismatchDeclared = artifactMap.has(baselineName)
                if (mismatchDeclared && baselineUrl && actualUrl) {
                  groupLines.push(`#### ❌ ${label}`)
                  groupLines.push('')
                  groupLines.push('| Baseline | Current |')
                  groupLines.push('| --- | --- |')
                  groupLines.push(
                    `| ![${label} baseline](${baselineUrl}) | ` +
                    `![${label} current](${actualUrl}) |`,
                  )
                  groupLines.push('')
                } else if (mismatchDeclared && (baselineUrl || actualUrl)) {
                  groupLines.push(`#### ❌ ${label}`)
                  groupLines.push('')
                  groupLines.push('The baseline/current pair was rejected or could not be published.')
                  groupLines.push('')
                } else if (!mismatchDeclared && showPassingCurrents && actualUrl) {
                  groupLines.push(`#### ✅ ${label}`)
                  groupLines.push('')
                  groupLines.push(`![${label} current](${actualUrl})`)
                  groupLines.push('')
                }
              }
              if (groupLines.length > 0) {
                gallery.push('')
                gallery.push('<details>')
                gallery.push(`<summary>${group.label}</summary>`)
                gallery.push('')
                gallery.push(...groupLines)
                gallery.push('</details>')
              }
            }
            if (gallery.length === 0) {
              gallery.push('')
              gallery.push('Capture gallery: no validated scenario images were available to publish.')
            }

            const diagnostics = artifactMap.get('visual-test-diagnostics')
            const supportArtifacts = diagnostics
              ? `[Diagnostics](${runUrl}/artifacts/${diagnostics.id})`
              : 'none available'
            const body = [
              marker,
              `${orderPrefix}${runId}:${runAttempt} -->`,
              '## Visual test',
              '',
              status,
              '',
              commitLine,
              `Workflow: [run #${runNumber}, attempt ${runAttempt}](${runUrl})`,
              ...details,
              ...gallery,
              '',
              `Support artifacts: ${supportArtifacts}`,
              `Support artifacts are retained through ${expiry} (14 days).`,
            ].join('\n')

            // Keep the eligibility check immediately adjacent to the final
            // write. Earlier reads and image publication may have taken long
            // enough for the label, head, draft state, or Stack position to change.
            if (await readEligiblePull() === null) {
              core.info('Pull request changed immediately before comment publication')
              return
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              })
            }
            if (reporterFailed) {
              core.setFailed('Visual-test report validation or image publication failed')
            }
