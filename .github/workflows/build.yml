# Build, test, inspect, and verify.

name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled ]

concurrency:
  # Only skip-ci label changes share the normal concurrency group. Other label
  # events must neither start Build nor cancel an in-flight Build run.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event_name == 'pull_request' &&
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    github.event.label.name != 'skip-ci') && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  build:
    name: >-
      ${{ (github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-ci') && 'Build (label event ignored)' || 'Build' }}
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'skip-ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plugin
        run: ./gradlew :plugin:buildPlugin

      - name: Upload Plugin Distribution
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./plugin/build/distributions/*.zip

  test:
    name: >-
      ${{ (github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-ci') && 'Test (label event ignored)' || 'Test' }}
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Tests
        run: ./gradlew check

      - name: Collect Failed Test Reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: |
            ${{ github.workspace }}/plugin/build/reports/tests

  inspectCode:
    name: >-
      ${{ (github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-ci') &&
      'Inspect Code (label event ignored)' || 'Inspect Code' }}
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Qodana Code Inspection
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          cache-default-branch-only: true
          pr-mode: false

  verify:
    name: >-
      ${{ (github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-ci') &&
      'Verify Plugin (label event ignored)' || 'Verify Plugin' }}
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verification
        run: >-
          ./gradlew
          :plugin:verifyPluginProjectConfiguration
          :plugin:verifyPluginStructure
          :plugin:verifyPlugin

      - name: Collect Plugin Verifier Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/plugin/build/reports/pluginVerifier
