name: Benchmark Contracts
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    name: JMH / ${{ matrix.job }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        job: [ analyzeCold, analyzeReuse, visibleQuery, repair, cancelledAttempt ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build before the measurement budget starts
        run: ./gradlew :benchmarks:jmhJar
      - name: Run the public calculation contract
        shell: bash
        run: |
          jars=(benchmarks/build/libs/*-jmh.jar)
          test "${#jars[@]}" -eq 1
          mkdir -p results
          timeout --signal=TERM --kill-after=10s 240s java -jar "${jars[0]}" \
            '.*\.${{ matrix.job }}' -bm avgt -wi 2 -w 1s -i 3 -r 1s -f 2 -t 1 \
            -jvmArgs '-Xms2g -Xmx2g' -prof gc -rf json -rff results/jmh.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.job }}
          path: results/
          if-no-files-found: error
      # Reporting is optional; a new metric without history is not a regression pass.
      # Allocation is retained in JMH JSON; the standard JMH adapter is not assumed to import B/op.
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
        if: vars.BENCHER_PROJECT != '' && github.event_name == 'push'
        with:
          version: 0.6.12
      - name: Apply the unchanged latency history gate
        if: vars.BENCHER_PROJECT != '' && github.event_name == 'push'
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_KEY }}
        run: >-
          bencher run --project "$BENCHER_PROJECT" --branch main
          --testbed ubuntu-24.04-x64 --adapter java_jmh --file results/jmh.json
          --threshold-measure latency --threshold-test percentage
          --threshold-upper-boundary 0.20 --error-on-alert
